<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Research Buddy</title>

  <link rel="stylesheet" href="popup.css">

</head>

<body>

  <div class="app">

    <header class="header">

      <div>
        <h1>Research Buddy</h1>
        <p>Your smart research notebook</p>
      </div>

      <div class="logo">RB</div>

    </header>


    <section class="page-card">

      <div class="page-icon">🌐</div>

      <div>
        <h3 id="pageTitle">Current Page</h3>
        <p id="pageDomain">No page selected</p>
      </div>

    </section>


    <div class="stats">

      <div class="stat-card">
        <span id="noteCount">0</span>
        <small>Highlights</small>
      </div>

      <div class="stat-card">
        <span id="selectionInfo">0</span>
        <small>Selected</small>
      </div>

    </div>


    <section class="highlights-section">

      <div class="section-heading">

        <h2>Saved Highlights</h2>

        <button id="selectAllBtn" class="small-btn">
          Select All
        </button>

      </div>


      <div id="highlightsContainer" class="highlights-container">

        <div class="empty-state">

          <div class="empty-icon">✨</div>

          <h3>No highlights yet</h3>

          <p>
            Select text on any webpage and use
            <b>Save Highlight</b>.
          </p>

        </div>

      </div>

    </section>


    <div class="actions">

      <button id="exportBtn" class="primary-btn">
        📥 Export
      </button>

      <button id="clearBtn" class="danger-btn">
        🗑 Clear
      </button>

    </div>


    <footer>

      <span>Research Buddy</span>
      <span>Simple • Fast • Useful</span>

    </footer>

  </div>


  <!-- Export Modal -->

  <div id="exportModal" class="modal hidden">

    <div class="modal-box">

      <button id="closeModal" class="close-btn">×</button>

      <h2>Export Highlights</h2>

      <p>Choose your preferred format.</p>


      <div class="format-options">

        <button class="format-btn active" data-format="txt">
          📄 TXT
        </button>

        <button class="format-btn" data-format="md">
          📝 Markdown
        </button>

      </div>


      <button id="downloadBtn" class="primary-btn full">
        Download
      </button>

    </div>

  </div>


  <script src="popup.js"></script>

</body>

</html>
